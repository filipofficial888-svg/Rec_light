name: Release instalátorů

# Spuštění: Actions > "Release instalátorů" > Run workflow, nebo push značky (tag) v*, např. v2.0
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sestavení RecLight.exe
        shell: pwsh
        run: |
          python -m pip install -r requirements.txt
          python make_icons.py
          python -m PyInstaller --noconsole --onefile --collect-submodules mido --hidden-import mido.backends.rtmidi --hidden-import rtmidi --hidden-import pystray._win32 --hidden-import gui --hidden-import vmidi --collect-all customtkinter --name RecLight --icon reclight.ico reclight.py
      - name: Inno Setup
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer.iss
      - uses: actions/upload-artifact@v4
        with:
          name: RecLight-Windows
          path: Output/*.exe

  macos:
    strategy:
      matrix:
        os: [macos-14, macos-15-intel]   # Apple Silicon a Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sestavení .dmg
        run: ./build_mac.sh
      - uses: actions/upload-artifact@v4
        with:
          name: RecLight-macOS-${{ matrix.os }}
          path: dist/*.dmg

  firmware-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: zip -r RecLight-Firmware.zip firmware README.md
      - uses: actions/upload-artifact@v4
        with:
          name: RecLight-Firmware
          path: RecLight-Firmware.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos, firmware-zip]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
